<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mock Test</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>

    <div class="test-container">


        <!-- ========================================= -->
        <!-- Test Header -->
        <!-- ========================================= -->

        <header class="test-header">


            <div>

                <h1>Mock Test</h1>

                <p id="progressText">
                    Question 1 of 1
                </p>

            </div>


            <div class="timer-box">

                <span>
                    Time Left
                </span>


                <strong id="timer">
                    20:00
                </strong>

            </div>


        </header>



        <!-- ========================================= -->
        <!-- Question -->
        <!-- ========================================= -->

        <main class="question-area">


            <div
                class="question-number"
                id="questionNumber">

                Question 1

            </div>


            <div
                class="question-text"
                id="questionText">

                Loading question...

            </div>



            <!-- Answer Options -->

            <div
                id="optionsContainer"
                class="options-container">
            </div>


        </main>



        <!-- ========================================= -->
        <!-- Previous / Next -->
        <!-- ========================================= -->

        <div class="test-navigation">


            <button
                type="button"
                id="previousButton">

                ← Previous

            </button>


            <button
                type="button"
                id="nextButton">

                Next →

            </button>


        </div>



        <!-- ========================================= -->
        <!-- Submit -->
        <!-- ========================================= -->

        <div class="submit-section">


            <button
                type="button"
                id="submitButton">

                Submit Test

            </button>


        </div>


    </div>



    <!-- ============================================= -->
    <!-- JavaScript -->
    <!-- ============================================= -->

    <script src="js/storage.js"></script>

    <script src="js/test.js"></script>


</body>

</html>

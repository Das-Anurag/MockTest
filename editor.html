<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Question Editor</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<div class="editor-container">


    <!-- ========================================= -->
    <!-- HEADER -->
    <!-- ========================================= -->

    <header>

        <h1>Question Editor</h1>

        <p class="subtitle">
            Create and manage your question bank
        </p>

    </header>


    <!-- ========================================= -->
    <!-- TEST SETTINGS -->
    <!-- ========================================= -->

    <section class="settings-section">

        <h2>Test Settings</h2>

        <p>
            These settings apply to the entire test.
        </p>


        <label for="positiveMarks">
            Marks for Correct Answer
        </label>

        <input
            type="number"
            id="positiveMarks"
            min="0"
            step="0.25"
            required
        >


        <label for="negativeMarks">
            Negative Marks for Wrong Answer
        </label>

        <input
            type="number"
            id="negativeMarks"
            min="0"
            step="0.25"
            required
        >


        <label for="testDuration">
            Test Duration (minutes)
        </label>

        <input
            type="number"
            id="testDuration"
            min="1"
            step="1"
            required
        >


        <button
            type="button"
            id="saveSettingsButton"
        >
            Save Test Settings
        </button>


        <p id="settingsMessage"></p>

    </section>


    <!-- ========================================= -->
    <!-- QUESTION FORM -->
    <!-- ========================================= -->

    <section class="question-section">


        <h2 id="formTitle">
            Add Question
        </h2>


        <form id="questionForm">


            <input
                type="hidden"
                id="questionId"
            >


            <!-- ===================================== -->
            <!-- QUESTION -->
            <!-- ===================================== -->

            <label for="question">
                Question
            </label>

            <textarea
                id="question"
                rows="4"
                placeholder="Enter your question..."
            ></textarea>


            <label for="questionImage">
                Question Image
                <span>(optional)</span>
            </label>

            <input
                type="file"
                id="questionImage"
                accept="image/*"
            >

            <div
                id="questionImagePreview"
                class="media-preview"
            ></div>


            <!-- ===================================== -->
            <!-- OPTION A -->
            <!-- ===================================== -->

            <label for="optionA">
                Option A
            </label>

            <input
                type="text"
                id="optionA"
                placeholder="Enter option A"
            >


            <label for="optionAImage">
                Option A Image
                <span>(optional)</span>
            </label>

            <input
                type="file"
                id="optionAImage"
                accept="image/*"
            >

            <div
                id="optionAImagePreview"
                class="media-preview"
            ></div>


            <!-- ===================================== -->
            <!-- OPTION B -->
            <!-- ===================================== -->

            <label for="optionB">
                Option B
            </label>

            <input
                type="text"
                id="optionB"
                placeholder="Enter option B"
            >


            <label for="optionBImage">
                Option B Image
                <span>(optional)</span>
            </label>

            <input
                type="file"
                id="optionBImage"
                accept="image/*"
            >

            <div
                id="optionBImagePreview"
                class="media-preview"
            ></div>


            <!-- ===================================== -->
            <!-- OPTION C -->
            <!-- ===================================== -->

            <label for="optionC">
                Option C
            </label>

            <input
                type="text"
                id="optionC"
                placeholder="Enter option C"
            >


            <label for="optionCImage">
                Option C Image
                <span>(optional)</span>
            </label>

            <input
                type="file"
                id="optionCImage"
                accept="image/*"
            >

            <div
                id="optionCImagePreview"
                class="media-preview"
            ></div>


            <!-- ===================================== -->
            <!-- OPTION D -->
            <!-- ===================================== -->

            <label for="optionD">
                Option D
            </label>

            <input
                type="text"
                id="optionD"
                placeholder="Enter option D"
            >


            <label for="optionDImage">
                Option D Image
                <span>(optional)</span>
            </label>

            <input
                type="file"
                id="optionDImage"
                accept="image/*"
            >

            <div
                id="optionDImagePreview"
                class="media-preview"
            ></div>


            <!-- ===================================== -->
            <!-- CORRECT ANSWER -->
            <!-- ===================================== -->

            <label for="correctAnswer">
                Correct Answer
            </label>

            <select
                id="correctAnswer"
                required
            >

                <option value="">
                    Select correct answer
                </option>

                <option value="A">
                    Option A
                </option>

                <option value="B">
                    Option B
                </option>

                <option value="C">
                    Option C
                </option>

                <option value="D">
                    Option D
                </option>

            </select>


            <!-- ===================================== -->
            <!-- BUTTONS -->
            <!-- ===================================== -->

            <div class="button-row">


                <button
                    type="submit"
                    id="saveButton"
                >
                    Save Question
                </button>


                <button
                    type="button"
                    id="cancelButton"
                >
                    Clear
                </button>


            </div>


        </form>

    </section>


    <!-- ========================================= -->
    <!-- QUESTION BANK -->
    <!-- ========================================= -->

    <section class="question-list">


        <h2>
            Question Bank
        </h2>


        <div id="questionCount">
            0 questions
        </div>


        <!-- ======================================= -->
        <!-- IMPORT / EXPORT -->
        <!-- ======================================= -->

        <div class="import-export-section">


            <h3>
                Question Bank Backup
            </h3>


            <p>
                Export your questions as a compact JSON
                file or import a previously saved file.
            </p>


            <div class="import-export-buttons">


                <button
                    type="button"
                    id="exportButton"
                >
                    Export Questions
                </button>


                <button
                    type="button"
                    id="importButton"
                >
                    Import Questions
                </button>


                <input
                    type="file"
                    id="importFile"
                    accept=".json,application/json"
                    hidden
                >


            </div>


        </div>


        <!-- ======================================= -->
        <!-- CLEAR ALL -->
        <!-- ======================================= -->

        <button
            type="button"
            id="clearAllButton"
        >
            Clear All Questions
        </button>


        <!-- ======================================= -->
        <!-- QUESTIONS -->
        <!-- ======================================= -->

        <div id="questionsContainer"></div>


    </section>


    <!-- ========================================= -->
    <!-- BACK HOME -->
    <!-- ========================================= -->

    <a
        href="index.html"
        class="home-link"
    >
        ← Back to Home
    </a>


</div>


<!-- ============================================= -->
<!-- JAVASCRIPT -->
<!-- ============================================= -->

<script src="js/storage.js"></script>

<script src="js/editor.js"></script>


</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mock Test</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 92%;
            max-width: 500px;
            background: white;
            padding: 30px 22px;
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 32px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .menu-button {
            display: block;
            width: 100%;
            padding: 16px;
            margin: 14px 0;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        .start {
            background: #2563eb;
            color: white;
        }

        .editor {
            background: #e5e7eb;
            color: #111827;
        }

        .result {
            background: #e5e7eb;
            color: #111827;
        }

        .menu-button:active {
            transform: scale(0.98);
        }

        .info {
            margin-top: 25px;
            padding-top: 18px;
            border-top: 1px solid #ddd;
            color: #777;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Mock Test</h1>

        <p class="subtitle">
            Personal Online Mock Test
        </p>

        <a href="test.html"
           class="menu-button start">
            Start Mock Test
        </a>

        <a href="editor.html"
           class="menu-button editor">
            Question Editor
        </a>

        <a href="result.html"
           class="menu-button result">
            View Last Result
        </a>

        <div class="info">
            <p>
                Create and manage your own question bank,
                take mock tests, and analyse your performance.
            </p>
        </div>

    </main>

</body>
</html>
